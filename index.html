<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>4 You</title>
  
  <!-- Manifest para la PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ffb6c1">

  <style>
    /* Estilos Generales de la App */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fffaf0;
      color: #4a4a4a;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Contenedor Principal */
    .app-container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      color: #ff6b81;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .btn-principal {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0px 4px 12px rgba(255, 107, 129, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 20px;
    }

    .btn-principal:active {
      transform: scale(0.96);
    }

    /* ------------------------------------------------------------- */
    /* PANTALLA INDEPENDIENTE DEL LIENZO                              */
    /* ------------------------------------------------------------- */
    #pantallaLienzo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #fffaf0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      box-sizing: border-box;
    }

    /* Clase para ocultar secciones */
    .seccion-oculta {
      display: none !important;
    }

    /* Cabecera del Lienzo */
    .header-lienzo {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-lienzo h2 {
      font-size: 1.2rem;
      color: #ff6b81;
      margin: 0;
    }

    .btn-volver, .btn-limpiar {
      background: #ffb6c1;
      border: none;
      padding: 8px 14px;
      border-radius: 15px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-limpiar {
      background: #ff6b6b;
    }

    /* El Canvas/Lienzo de dibujo */
    #canvasDibujo {
      background: #ffffff;
      border: 3px dashed #ffb6c1;
      border-radius: 20px;
      touch-action: none; /* Desactiva el scroll al dibujar en móviles */
      cursor: crosshair;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.05);
    }

    /* Barra de herramientas flotante abajo */
    .herramientas-lienzo {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #ffffff;
      padding: 10px 18px;
      border-radius: 30px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-herramienta {
      background: #f0f0f0;
      border: none;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn-herramienta.activo {
      background: #ffb6c1;
      color: white;
    }

    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="range"] {
      width: 80px;
    }
  </style>
</head>
<body>

  <!-- Contenido de la Pantalla Principal -->
  <div class="app-container">
    <h1>4 You 💖</h1>
    <p>Un rincón especial hecho con amor.</p>

    <!-- Botón para acceder al apartado del lienzo -->
    <button class="btn-principal" onclick="abrirLienzo()">🎨 Abrir Lienzo de Garabatos</button>
  </div>

  <!-- PANTALLA INDEPENDIENTE: LIENZO DE DIBUJO -->
  <div id="pantallaLienzo" class="seccion-oculta">
    
    <div class="header-lienzo">
      <button onclick="cerrarLienzo()" class="btn-volver">⬅ Volver</button>
      <h2>🎨 Nuestro Lienzo</h2>
      <button onclick="borrarLienzo()" class="btn-limpiar">🗑️ Limpiar</button>
    </div>

    <!-- ÁREA DE DIBUJO -->
    <canvas id="canvasDibujo"></canvas>

    <!-- BARRA DE HERRAMIENTAS -->
    <div class="herramientas-lienzo">
      <button id="btnPincel" onclick="activarPincel()" class="btn-herramienta activo">✏️ Pincel</button>
      <button id="btnBorrador" onclick="activarBorrador()" class="btn-herramienta">🧹 Borrador</button>
      
      <input type="color" id="colorPincel" value="#ff6b81" title="Elegir color">
      <input type="range" id="grosorPincel" min="2" max="25" value="6" title="Grosor del pincel">
    </div>

  </div>

  <!-- LOGICA JAVASCRIPT -->
  <script>
    // --- VARIABLES Y ELEMENTOS DEL LIENZO ---
    const canvas = document.getElementById('canvasDibujo');
    const ctx = canvas.getContext('2d');
    const colorInput = document.getElementById('colorPincel');
    const grosorInput = document.getElementById('grosorPincel');
    const btnPincel = document.getElementById('btnPincel');
    const btnBorrador = document.getElementById('btnBorrador');

    let dibujando = false;
    let colorAnterior = colorInput.value;
    let esBorrador = false;

    // --- ABRIR Y CERRAR LA SECCIÓN DEL LIENZO ---
    function abrirLienzo() {
      document.getElementById('pantallaLienzo').classList.remove('seccion-oculta');
      redimensionarCanvas();
    }

    function cerrarLienzo() {
      document.getElementById('pantallaLienzo').classList.add('seccion-oculta');
    }

    // --- REDIMENSIONAR CANVAS Y CARGAR DIBUJO ---
    function redimensionarCanvas() {
      // Ajuste proporcional para celulares y pantalla de computadora
      const ancho = Math.min(window.innerWidth * 0.9, 450);
      const alto = window.innerHeight * 0.65;
      
      canvas.width = ancho;
      canvas.height = alto;
      
      // Rellenar fondo blanco limpio por defecto
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Cargar dibujo permanente si existe en memoria
      cargarDibujoGuardado();
    }

    // --- LÓGICA DE DIBUJO (TACTIL Y MOUSE) ---
    function obtenerPosicion(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function iniciarDibujo(e) {
      dibujando = true;
      const pos = obtenerPosicion(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function dibujar(e) {
      if (!dibujando) return;
      e.preventDefault(); // Evita scroll en móviles
      
      const pos = obtenerPosicion(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = esBorrador ? '#ffffff' : colorInput.value;
      ctx.lineWidth = grosorInput.value;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    function detenerDibujo() {
      if (dibujando) {
        dibujando = false;
        ctx.closePath();
        guardarDibujo(); // 💾 Guardado automático en localStorage
      }
    }

    // Escuchadores para Mouse
    canvas.addEventListener('mousedown', iniciarDibujo);
    canvas.addEventListener('mousemove', dibujar);
    canvas.addEventListener('mouseup', detenerDibujo);
    canvas.addEventListener('mouseleave', detenerDibujo);

    // Escuchadores para Pantallas Táctiles (Celulares)
    canvas.addEventListener('touchstart', iniciarDibujo);
    canvas.addEventListener('touchmove', dibujar);
    canvas.addEventListener('touchend', detenerDibujo);

    // --- SELECCIÓN DE HERRAMIENTAS (PINCEL / BORRADOR) ---
    function activarPincel() {
      esBorrador = false;
      btnPincel.classList.add('activo');
      btnBorrador.classList.remove('activo');
    }

    function activarBorrador() {
      esBorrador = true;
      btnBorrador.classList.add('activo');
      btnPincel.classList.remove('activo');
    }

    // Cambiar a modo pincel automáticamente si selecciona un color nuevo
    colorInput.addEventListener('change', () => {
      activarPincel();
    });

    // --- GUARDADO PERMANENTE EN LOCALSTORAGE ---
    function guardarDibujo() {
      const dataURL = canvas.toDataURL();
      localStorage.setItem('dibujoGuardado_4you', dataURL);
    }

    function cargarDibujoGuardado() {
      const dibujoGuardado = localStorage.getItem('dibujoGuardado_4you');
      if (dibujoGuardado) {
        const img = new Image();
        img.src = dibujoGuardado;
        img.onload = () => {
          ctx.drawImage(img, 0, 0);
        };
      }
    }

    function borrarLienzo() {
      if (confirm("¿Quieres borrar el dibujo actual?")) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        localStorage.removeItem('dibujoGuardado_4you');
      }
    }

    // --- REGISTRO DEL SERVICE WORKER (PWA) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker listo:', reg.scope))
          .catch((err) => console.log('Error en Service Worker:', err));
      });
    }
  </script>
</body>
</html>
